worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        # Revalidate the shell and unversioned public assets after an upgrade.
        add_header Cache-Control "no-cache" always;

        # Retired API paths must never fall back to the SPA.
        location ~* ^/api(?:/|$) { return 404; }
        location ~ (^|/)\. { return 404; }

        # Vite hashes these filenames. Missing chunks must be a real 404.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(?:js|css|wasm|json|map|txt|svg|png|jpe?g|ico|woff2?|ttf)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
